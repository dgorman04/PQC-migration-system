# Local / minikube-equivalent stack. See README.md §6.
#
# Working today:  postgres, neo4j, mlflow
# Not yet built:  pqc-core-api, pqc-inference, ai-api, dashboard — their
#   services are stubbed out below (commented) so this file is the checklist
#   to fill in as each component (README §7) gets built. Uncomment a block
#   once that component has a Dockerfile.
#
# Usage:
#   cp ../.env.example ../.env          # once, then edit
#   docker compose --env-file ../.env up -d postgres neo4j mlflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pqc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pqc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pqc_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-pqc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pqc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: pqc-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/pqc_dev_only_change_me}
      # Community edition — no enterprise features needed at this scale.
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # bolt protocol (loader + query module use this)
    volumes:
      - ./.neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ./mlflow
    container_name: pqc-mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./.mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000')\""]
      interval: 10s
      timeout: 5s
      retries: 10

